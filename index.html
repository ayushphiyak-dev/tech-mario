<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYTE RUNNER — Ultimate Edition</title>
<meta name="description" content="A neon-arcade platformer with 2D/3D views, co-op mode, boosts, boss-free but hazard-packed levels, and a local leaderboard.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%2302071a'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%234fd4ff'%3E▶%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="topbar">
    <div class="ibtn" id="viewBtn" title="Toggle 2D/3D View (V)">3D</div>
    <div class="ibtn" id="restartBtn" title="Restart Level (R)">↺</div>
    <div class="ibtn" id="muteBtn" title="Mute (M)">🔊</div>
    <div class="ibtn" id="fsBtn" title="Fullscreen (F)">⛶</div>
  </div>
  <div id="touchpad">
    <div id="dpad">
      <div class="tbtn" id="btnLeft">◀</div>
      <div class="tbtn" id="btnRight">▶</div>
    </div>
    <div class="tbtn" id="jumpbtn">JUMP</div>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
